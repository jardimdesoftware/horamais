name: Backend CI/CD Workflow

on:
  push:
    branches:
      - main
    paths:
      - "back/**"
      - ".github/workflows/**"

  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - closed
    paths:
      - "back/**"
      - ".github/workflows/**"

  workflow_dispatch:
    inputs:
      change_type:
        description: 'Tipo de mudanca (novo-marco, nova-feature, bug-fix, outros)'
        required: true
        default: 'nova-feature'
        type: choice
        options:
          - novo-marco
          - nova-feature
          - bug-fix
          - outros

# Serializa publicações para evitar disputa pelas tags de versão e latest.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # --------------------------------------------------------------------
  # 0) TAG CREATION ----------------------------------------------------
  # --------------------------------------------------------------------
  tag-creation:
    name: 0. Automatic Creation Process of New Tags
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.action != 'closed' || github.event.pull_request.merged == true
    permissions:
      contents: write
    outputs:
      created_tag: ${{ steps.created_tag.outputs.created_tag }}
      change_type: ${{ steps.created_tag.outputs.change_type }}

    steps:
      - uses: actions/checkout@v4

      - name: Install GitHub CLI
        run: sudo apt-get install -y gh

      - name: Write PR body and log context
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "PR merged: ${{ github.event.pull_request.merged }}"
          printf '%s' "$PR_BODY" > body.txt
          echo "--- PR body ---"
          cat body.txt
          echo "--- end ---"

      - name: Extract type of change from PR
        id: change_type
        if: github.event.pull_request.merged == true
        run: |
          change_type=""
          if grep -qiE "\[x\]\s*\`?novo-marco\`?" body.txt; then
            change_type="novo-marco"
          elif grep -qiE "\[x\]\s*\`?nova-feature\`?" body.txt; then
            change_type="nova-feature"
          elif grep -qiE "\[x\]\s*\`?bug-fix\`?" body.txt; then
            change_type="bug-fix"
          elif grep -qiE "\[x\]\s*\`?outros\`?" body.txt; then
            change_type="outros"
          else
            echo "Nenhuma opção marcada corretamente no corpo do PR. Conteúdo:"
            cat body.txt
            exit 1
          fi
          echo "Tipo detectado: $change_type"
          echo "change_type=$change_type" >> "$GITHUB_OUTPUT"

      - name: Get the last release tag
        if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
        id: last_tag
        run: |
          gh auth setup-git
          tag=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
          if [[ -z "$tag" ]]; then tag="0.0.0"; fi
          echo "last_tag=$tag" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Calculate new tag
        id: created_tag
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ github.event.pull_request.merged }}" != "true" ]]; then
            echo "created_tag=pr-${{ github.event.number }}-${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "change_type=outros" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            change_type="${{ github.event.inputs.change_type }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            change_type="outros"
          else
            change_type="${{ steps.change_type.outputs.change_type }}"
          fi
          IFS='.' read -r major minor patch <<< "${{ steps.last_tag.outputs.last_tag }}"
          case "$change_type" in
            bug-fix|outros)
              patch=$((patch + 1))
              ;;
            nova-feature)
              minor=$((minor + 1))
              patch=0
              ;;
            novo-marco)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
          esac
          created_tag="${major}.${minor}.${patch}"
          echo "Nova tag: $created_tag"
          echo "change_type=$change_type" >> "$GITHUB_OUTPUT"
          echo "created_tag=$created_tag" >> "$GITHUB_OUTPUT"

  # --------------------------------------------------------------------
  # 1) BACKEND DOCKER --------------------------------------------------
  # --------------------------------------------------------------------
  backend-docker:
    name: 1. Backend CI/CD
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    needs: tag-creation
    env:
      CREATED_TAG: ${{ needs.tag-creation.outputs.created_tag }}
      CHANGE_TYPE: ${{ needs.tag-creation.outputs.change_type }}
      REGISTRY: ghcr.io
      IMAGE_NAME: horas-discentes-backend
    permissions:
      contents: write
      packages: write
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0"

      - name: Restore dependencies
        run: |
          cd back/Back.API
          dotnet restore Back.sln

      - name: Build
        run: |
          cd back/Back.API
          dotnet build Back.sln --no-restore

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare image metadata
        id: image
        run: |
          echo "ref=ghcr.io/${{ github.repository_owner }}/horas-discentes-backend:build-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./back
          file: ./back/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: ${{ steps.image.outputs.ref }}
          build-args: |
            VERSION=${{ env.CREATED_TAG }}
            REVISION=${{ github.sha }}
            BUILDTIME=${{ steps.image.outputs.built_at }}
          cache-from: type=gha,scope=backend-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=backend-${{ matrix.arch }}

      - name: Verify image architecture
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          test "$(docker image inspect "$IMAGE_REF" --format '{{.Os}}/{{.Architecture}}')" = "linux/$EXPECTED_ARCH"

      - name: Verify unprivileged backend runtime
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          docker run --rm --network none --entrypoint sh "$IMAGE_REF" -ec '
            test "$(id -u)" -ne 0
            test -w /app/logs
            test -w /home/app/.aspnet/DataProtection-Keys
          '

      - name: Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL
        env:
          TRIVY_IMAGE_SRC: docker

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push scanned image
        if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: docker push "$IMAGE_REF"

  publish-manifest:
    name: Publish AMD64 and ARM64 manifest
    runs-on: ubuntu-latest
    needs: [tag-creation, backend-docker]
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/horas-discentes-backend
      CREATED_TAG: ${{ needs.tag-creation.outputs.created_tag }}
      BUILD_TAG: build-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish version manifest
        run: |
          docker buildx imagetools create --tag "$IMAGE:$CREATED_TAG" \
            "$IMAGE:$BUILD_TAG-amd64" "$IMAGE:$BUILD_TAG-arm64"

      - name: Verify published platforms
        run: |
          docker buildx imagetools inspect "$IMAGE:$CREATED_TAG" --raw | \
            jq -e '[.manifests[].platform | .os + "/" + .architecture] | sort == ["linux/amd64", "linux/arm64"]'

      - name: Promote verified manifest to latest
        run: docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$CREATED_TAG"

  # --------------------------------------------------------------------
  # 3) RELEASE CREATION ------------------------------------------------
  # --------------------------------------------------------------------
  release-creation:
    name: 3. Automatic Creation Process of New Releases
    runs-on: ubuntu-latest
    needs: [tag-creation, publish-manifest]
    if: github.event_name == 'push' || github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    env:
      CREATED_TAG: ${{ needs.tag-creation.outputs.created_tag }}
      CHANGE_TYPE: ${{ needs.tag-creation.outputs.change_type }}
      REGISTRY: ghcr.io
      IMAGE_NAME: horas-discentes-backend
    steps:
      - uses: actions/checkout@v4

      - name: Release Publication
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.CREATED_TAG }}
          name: Release ${{ env.CREATED_TAG }}
          generate_release_notes: true
          body: |
            Release gerada automaticamente.
            Tipo de mudança: ${{ env.CHANGE_TYPE || github.event.inputs.change_type }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
