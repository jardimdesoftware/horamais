name: Production deployment

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/production-deploy.yml"
      - "scripts/deploy/**"
      - "docker-compose.yml"
      - "garage.toml"
      - "back/Back.API/Program.cs"
  workflow_run:
    workflows:
      - Backend CI/CD Workflow
      - Frontend CI/CD Workflow
    types: [completed]

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  validate:
    name: Validate deploy contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check scripts and rollback behavior
        run: |
          bash -n scripts/deploy/*.sh
          bash scripts/deploy/test-deploy.sh
      - name: Check Compose image overrides
        env:
          GARAGE_RPC_SECRET: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          GARAGE_ACCESS_KEY: GKaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          GARAGE_SECRET_KEY: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          BACKEND_IMAGE: ghcr.io/example/horas-discentes-backend@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          FRONTEND_IMAGE: ghcr.io/example/horas-discentes-frontend@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
        run: docker compose -f docker-compose.yml config --quiet

  deploy:
    name: Deploy approved images to VM
    if: ${{ github.event_name == 'workflow_run' && vars.DEPLOY_ENABLED == 'true' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify both workflows approved the current main commit
        id: pair
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ github.event.workflow_run.head_sha }}
        run: bash scripts/deploy/check-runs.sh "$REVISION"

      - name: Set up Docker Buildx
        if: steps.pair.outputs.ready == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Resolve approved image digests
        if: steps.pair.outputs.ready == 'true'
        id: images
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
          owner=${GITHUB_REPOSITORY_OWNER,,}
          for component in backend frontend; do
            image="ghcr.io/$owner/horas-discentes-$component"
            digest=$(docker buildx imagetools inspect "$image:sha-$REVISION" | awk '$1 == "Digest:" { print $2; exit }')
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "Digest invalido para $component" >&2; exit 1; }
            echo "$component=$image@$digest" >> "$GITHUB_OUTPUT"
          done

      - name: Configure pinned SSH host and key
        if: steps.pair.outputs.ready == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_SSH_KEY" && test -n "$DEPLOY_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"

      - name: Deploy exact digests and verify stack
        if: steps.pair.outputs.ready == 'true'
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          BACKEND_IMAGE: ${{ steps.images.outputs.backend }}
          FRONTEND_IMAGE: ${{ steps.images.outputs.frontend }}
          REVISION: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_main=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')
          if [[ "$current_main" != "$REVISION" ]]; then
            echo "A main avancou; deploy da revisao $REVISION ignorado"
            exit 0
          fi
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-zA-Z0-9_-]+$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          [[ "$DEPLOY_PATH" =~ ^/[a-zA-Z0-9_./-]+$ && "$DEPLOY_PATH" != *..* ]]
          ssh_opts=(-i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -p "$DEPLOY_PORT")
          target="$DEPLOY_USER@$DEPLOY_HOST"
          stage="$DEPLOY_PATH/.incoming-$GITHUB_RUN_ID"
          ssh "${ssh_opts[@]}" "$target" "mkdir -p '$stage'"
          scp -i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -P "$DEPLOY_PORT" \
            docker-compose.yml garage.toml scripts/deploy/deploy-vm.sh "$target:$stage/"
          printf '%s\n' "$GH_TOKEN" | ssh "${ssh_opts[@]}" "$target" \
            "bash '$stage/deploy-vm.sh' '$DEPLOY_PATH' '$GITHUB_RUN_ID' '$BACKEND_IMAGE' '$FRONTEND_IMAGE' '$REVISION' '$GITHUB_ACTOR'"
