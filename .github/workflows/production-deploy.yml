name: Production deployment

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/production-deploy.yml"
      - "scripts/deploy/**"
      - "docker-compose.yml"
      - "garage.toml"
      - "back/Back.API/Program.cs"

permissions:
  contents: read

jobs:
  validate:
    name: Validate deploy contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check scripts and rollback behavior
        run: |
          bash -n scripts/deploy/*.sh
          bash scripts/deploy/test-deploy.sh
      - name: Check Compose image overrides and proxy ports
        env:
          PORT_MACHINE_FRONTEND: "127.0.0.1:3000"
          GARAGE_RPC_SECRET: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          GARAGE_ACCESS_KEY: GKaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          GARAGE_SECRET_KEY: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          BACKEND_IMAGE: ghcr.io/example/horas-discentes-backend@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          FRONTEND_IMAGE: ghcr.io/example/horas-discentes-frontend@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
        run: |
          docker compose -f docker-compose.yml config --format json | jq -e '
            (.services.frontend.ports | length == 1) and
            (.services.frontend.ports[0] | .host_ip == "127.0.0.1" and .target == 3000 and (.published | tostring) == "3000") and
            (.services.backend.ports | length == 1) and
            (.services.backend.ports[0] | .host_ip == "127.0.0.1" and .target == 5000 and (.published | tostring) == "5000") and
            ((.services.db.ports // []) | length == 0) and
            ((.services.garage.ports // []) | length == 0)
          ' > /dev/null
