# Isolated, disposable DAST stack. Never use production volumes or credentials.
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: dast
      POSTGRES_USER: dast
      POSTGRES_PASSWORD: ${DAST_PASSWORD:-unset}
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U dast -d dast']
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [scan]

  storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    environment:
      MINIO_ROOT_USER: dast-storage
      MINIO_ROOT_PASSWORD: ${DAST_PASSWORD:-unset}
    networks: [scan]

  mail:
    image: axllent/mailpit:v1.27
    networks: [scan]

  backend:
    build: ./back
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=dast;Username=dast;Password=${DAST_PASSWORD:-unset}
      JWT__Key: ${DAST_JWT_KEY:-unset}
      JWT__Issuer: horamais-dast
      JWT__Audience: horamais-dast
      ADMIN_EMAIL: admin@dast.invalid
      ADMIN_PASSWORD: ${DAST_PASSWORD:-unset}
      CORS_ALLOWED_ORIGIN: http://frontend:3000
      Authentication__Google__ClientId: unused-dast-client
      EMAIL__Remetente: noreply@dast.invalid
      EMAIL__LocalSmtp: 'true'
      EMAIL__Smtp: mail
      EMAIL__Porta: '1025'
      FileStorage__Endpoint: http://storage:9000
      FileStorage__AccessKey: dast-storage
      FileStorage__SecretKey: ${DAST_PASSWORD:-unset}
      FileStorage__BucketName: certificados
      FileStorage__UseSSL: 'false'
    ports: ['127.0.0.1:15000:5000']
    depends_on:
      db:
        condition: service_healthy
    networks: [scan]

  frontend:
    build:
      context: ./front
      args:
        NEXT_PUBLIC_API_URL: ''
    environment:
      INTERNAL_API_URL: http://backend:5000/api
      NEXTAUTH_URL: http://frontend:3000
      NEXTAUTH_SECRET: ${DAST_JWT_KEY:-unset}
      GOOGLE_CLIENT_ID: unused-dast-client
      GOOGLE_CLIENT_SECRET: unused-dast-secret
    ports: ['127.0.0.1:13000:3000']
    networks: [scan]

  zap:
    image: ghcr.io/zaproxy/zaproxy:2.17.0
    profiles: [scanner]
    command:
      - zap.sh
      - -daemon
      - -host
      - 0.0.0.0
      - -port
      - '8080'
      - -config
      - api.key=${DAST_ZAP_KEY:-unset}
      - -config
      - api.addrs.addr.name=.*
      - -config
      - api.addrs.addr.regex=true
    environment:
      ZAP_AUTH_HEADER_VALUE: ${DAST_AUTH_HEADER:-unset}
      ZAP_AUTH_HEADER_SITE: backend
    ports: ['127.0.0.1:18080:8080']
    networks: [scan]

networks:
  scan:
    internal: true
