services:
  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        VERSION: dev
        REVISION: local
        BUILDTIME: dev
    container_name: horas-discentes-frontend-dev
    ports:
      - "127.0.0.1:${PORT_MACHINE_FRONTEND}:3000"
    environment:
      - INTERNAL_API_URL=http://backend:5000/api
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    networks:
      - rede-back-dev
    depends_on:
      - backend

  backend:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: horas-discentes-backend-dev
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - JWT__Key=${JWT__Key}
      - JWT__Issuer=${JWT__Issuer}
      - JWT__Audience=${JWT__Audience}
      - Authentication__Google__ClientId=${GOOGLE_CLIENT_ID}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - COORD_EMAIL=${COORD_EMAIL}
      - COORD_PASSWORD=${COORD_PASSWORD}
      - COORD_NOME=${COORD_NOME}
      - COORD_PORTARIA=${COORD_PORTARIA}
      - COORD_DOU=${COORD_DOU}
      - CURSO_NOME=${CURSO_NOME}
      - EMAIL__Remetente=${EMAIL__Remetente}
      - EMAIL__LocalSmtp=true
      - EMAIL__Smtp=mailpit
      - EMAIL__Porta=1025
      - COORDENADOR_CONVITE_LINK=http://localhost:3000/criarContaCoordenador
      - FileStorage__Endpoint=http://garage:3900
      - FileStorage__AccessKey=${GARAGE_ACCESS_KEY:?Defina GARAGE_ACCESS_KEY}
      - FileStorage__SecretKey=${GARAGE_SECRET_KEY:?Defina GARAGE_SECRET_KEY}
      - FileStorage__BucketName=${GARAGE_BUCKET:-certificados}
      - FileStorage__Region=garage
      - FileStorage__UseSSL=false
    volumes:
      - backend_data_protection_keys_dev:/home/app/.aspnet/DataProtection-Keys
      # Persiste os logs do backend no host para inspeção
      - ./logs/backend:/app/logs
    networks:
      - rede-back-dev
    depends_on:
      db:
        condition: service_healthy
      garage:
        condition: service_healthy
      mailpit:
        condition: service_started

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - rede-back-dev

  db:
    image: postgres:15
    container_name: horas-discentes-db-dev
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    networks:
      - rede-back-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  garage:
    image: dxflrs/garage:v2.4.1
    container_name: horas-discentes-garage-dev
    ports:
      - "127.0.0.1:9002:3900"
    environment:
      - GARAGE_RPC_SECRET=${GARAGE_RPC_SECRET:?Defina GARAGE_RPC_SECRET}
      - GARAGE_DEFAULT_ACCESS_KEY=${GARAGE_ACCESS_KEY:?Defina GARAGE_ACCESS_KEY}
      - GARAGE_DEFAULT_SECRET_KEY=${GARAGE_SECRET_KEY:?Defina GARAGE_SECRET_KEY}
      - GARAGE_DEFAULT_BUCKET=${GARAGE_BUCKET:-certificados}
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage_meta_dev:/var/lib/garage/meta
      - garage_data_dev:/var/lib/garage/data
    networks:
      - rede-back-dev
    command: /garage server --single-node --default-bucket
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata_dev:
  backend_data_protection_keys_dev:
  garage_meta_dev:
  garage_data_dev:

networks:
  rede-back-dev:
