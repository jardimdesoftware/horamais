events {}
http {
    # Do not log ZAP API keys or authentication requests.
    access_log off;
    resolver 127.0.0.11 valid=5s;
    server {
        listen 5000;
        location / {
            set $target http://backend:5000;
            proxy_pass $target;
        }
    }
    server {
        listen 3000;
        location / {
            set $target http://frontend:3000;
            proxy_pass $target;
        }
    }
    server {
        listen 8080;
        location / {
            set $target http://zap:8080;
            proxy_pass $target;
            proxy_read_timeout 120s;
        }
    }
}
