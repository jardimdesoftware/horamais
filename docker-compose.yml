services:
  frontend:
    image: "ghcr.io/${GHCR_OWNER:-jardimdesoftware}/horas-discentes-frontend:latest"
    pull_policy: always
    ports:
      - "${PORT_MACHINE_FRONTEND}:3000"
    environment:
      - INTERNAL_API_URL=http://backend:5000/api
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    networks:
      - rede-back
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    image: "ghcr.io/${GHCR_OWNER:-jardimdesoftware}/horas-discentes-backend:latest"
    pull_policy: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=${DATABASE_URL}
      - JWT__Key=${JWT__Key}
      - JWT__Issuer=${JWT__Issuer}
      - JWT__Audience=${JWT__Audience}
      - CORS_ALLOWED_ORIGIN=${CORS_ALLOWED_ORIGIN}
      - Authentication__Google__ClientId=${GOOGLE_CLIENT_ID}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - COORD_EMAIL=${COORD_EMAIL}
      - COORD_PASSWORD=${COORD_PASSWORD}
      - COORD_NOME=${COORD_NOME}
      - COORD_PORTARIA=${COORD_PORTARIA}
      - COORD_DOU=${COORD_DOU}
      - CURSO_NOME=${CURSO_NOME}
      - CURSO_MAX_HORAS_COMPLEMENTAR=${CURSO_MAX_HORAS_COMPLEMENTAR:-120}
      - EMAIL__Remetente=${EMAIL__Remetente}
      - EMAIL__Senha=${EMAIL__Senha}
      - EMAIL__Smtp=${EMAIL__Smtp}
      - EMAIL__Porta=${EMAIL__Porta}
      - SECRETARIA_EMAIL=${SECRETARIA_EMAIL}
      - COORDENADOR_CONVITE_LINK=${COORDENADOR_CONVITE_LINK}
      - FileStorage__Endpoint=http://garage:3900
      - FileStorage__AccessKey=${GARAGE_ACCESS_KEY:?Defina GARAGE_ACCESS_KEY}
      - FileStorage__SecretKey=${GARAGE_SECRET_KEY:?Defina GARAGE_SECRET_KEY}
      - FileStorage__BucketName=${GARAGE_BUCKET:-certificados}
      - FileStorage__Region=garage
      - FileStorage__UseSSL=false
    volumes:
      - backend_data_protection_keys:/home/app/.aspnet/DataProtection-Keys
    networks:
      - rede-back
    depends_on:
      db:
        condition: service_healthy
      garage:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15
    container_name: horas-discentes-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - rede-back
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  garage:
    image: dxflrs/garage:v2.4.1
    container_name: horas-discentes-garage
    environment:
      - GARAGE_RPC_SECRET=${GARAGE_RPC_SECRET:?Defina GARAGE_RPC_SECRET}
      - GARAGE_DEFAULT_ACCESS_KEY=${GARAGE_ACCESS_KEY:?Defina GARAGE_ACCESS_KEY}
      - GARAGE_DEFAULT_SECRET_KEY=${GARAGE_SECRET_KEY:?Defina GARAGE_SECRET_KEY}
      - GARAGE_DEFAULT_BUCKET=${GARAGE_BUCKET:-certificados}
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    networks:
      - rede-back
    command: /garage server --single-node --default-bucket
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
  backend_data_protection_keys:
  garage_meta:
  garage_data:

networks:
  rede-back:
